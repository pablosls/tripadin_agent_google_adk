<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tripadinho - Entrar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="text-3xl font-bold text-orange-600 mb-2 block"><i class="fa-solid fa-umbrella-beach"></i> Tripadinho</a>
            <p class="text-gray-500">Entre para salvar seus objetivos</p>
        </div>

        <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 p-3 rounded-lg hover:bg-gray-50 transition-colors font-medium mb-6">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Entrar com Google
        </button>

        <div class="flex items-center mb-6">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="px-3 text-gray-400 text-sm">ou com e-mail</span>
            <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">E-mail</label>
                <input type="email" id="email" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
                <input type="password" id="password" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            
            <div id="errorMessage" class="hidden text-red-500 text-sm text-center"></div>

            <button type="submit" id="submitBtn" class="w-full bg-orange-600 text-white p-3 rounded-lg font-bold hover:bg-orange-700 transition-colors">
                Entrar
            </button>
        </form>

        <p class="text-center mt-6 text-gray-600">
            Não tem uma conta? 
            <button onclick="toggleMode()" id="toggleBtn" class="text-orange-600 font-bold hover:underline">Cadastre-se</button>
        </p>
    </div>

    <!-- Load Auth Logic -->
    <script src="/js/auth.js"></script>
    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('submitBtn').innerText = isLogin ? 'Entrar' : 'Criar Conta';
            document.getElementById('toggleBtn').innerText = isLogin ? 'Cadastre-se' : 'Fazer Login';
            document.getElementById('errorMessage').classList.add('hidden');
        }

        async function handleGoogleLogin() {
            try {
                await window.auth.signInWithGoogle();
            } catch (e) {
                alert("Erro ao logar com Google: " + e.message);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const btn = document.getElementById('submitBtn');
            
            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = 'Aguarde...';

            try {
                if (isLogin) {
                    await window.auth.signIn(email, password);
                    window.location.href = '/objectives.html';
                } else {
                    await window.auth.signUp(email, password);
                    alert("Conta criada! Você já pode acessar.");
                    window.location.href = '/objectives.html';
                }
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = isLogin ? 'Entrar' : 'Criar Conta';
            }
        });
    </script>
</body>
</html>
