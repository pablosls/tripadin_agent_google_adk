<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tripadinho - Meu Perfil</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="flex-shrink-0 flex items-center text-2xl font-black text-blue-600 tracking-tight">
                        🌴 Tripadinho
                    </a>
                    <div class="hidden md:flex space-x-4 items-center">
                        <a href="index.html" class="text-slate-600 hover:text-blue-600 px-3 py-2 rounded-md font-medium text-sm transition">Início</a>
                        <a href="destination.html" class="text-slate-600 hover:text-blue-600 px-3 py-2 rounded-md font-medium text-sm transition">Experiências</a>
                        <a href="objectives.html" class="text-slate-600 hover:text-blue-600 font-semibold transition auth-logged-in hidden">Meus Objetivos</a>
                        <a href="profile.html" class="text-blue-600 font-bold transition auth-logged-in hidden">Meu Perfil</a>
                        <a href="/adk/" target="_blank" class="text-purple-700 bg-purple-50 hover:bg-purple-100 font-bold px-3 py-1.5 rounded-full transition text-xs flex items-center border border-purple-200">🤖 ADK Web UI</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="auth-section">
                        <a href="login.html" id="login-btn" class="auth-logged-out bg-blue-600 text-white px-5 py-2.5 rounded-full font-bold hover:bg-blue-700 hover:shadow-lg transition transform hover:-translate-y-0.5 inline-block">
                            Entrar
                        </a>
                        <button onclick="window.auth.signOut()" class="auth-logged-in hidden text-red-600 hover:text-red-800 font-semibold ml-4">
                            Sair
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-md text-center hidden" id="profile-card">
            
            <div class="relative w-24 h-24 mx-auto mb-4">
                <img id="profile-avatar" src="https://ui-avatars.com/api/?name=User&background=random" class="rounded-full w-full h-full object-cover shadow-sm border-4 border-white" alt="Avatar do Usuário">
                <div class="absolute bottom-0 right-0 bg-blue-500 w-6 h-6 rounded-full border-2 border-white flex items-center justify-center text-white text-xs">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>

            <h2 id="profile-name" class="text-2xl font-bold text-slate-800 mb-1">Carregando...</h2>
            <p id="profile-email" class="text-slate-500 text-sm mb-6">carregando@email.com</p>

            <div class="bg-slate-50 rounded-xl p-4 mb-6 text-left border border-slate-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Conta Criada em</span>
                    <span id="profile-date" class="text-sm font-medium text-slate-700">--/--/----</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Status</span>
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full border border-emerald-100">Ativa</span>
                </div>
            </div>

            <div class="space-y-3">
                <a href="objectives.html" class="block w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-sm">
                    Ver Meus Objetivos
                </a>
                <button onclick="window.auth.signOut()" class="w-full py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition border border-slate-200">
                    Sair da Conta
                </button>
                <button onclick="deleteAccount()" id="delete-btn" class="w-full py-3 px-4 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl transition border border-rose-100 mt-4">
                    Excluir Minha Conta
                </button>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.auth.init();
            window.auth.requireAuth();

            if (window.auth.session) {
                const user = window.auth.session.user;
                
                // Mostrar o card
                document.getElementById('profile-card').classList.remove('hidden');

                // Preencher dados
                const email = user.email;
                const metadata = user.user_metadata || {};
                
                const name = metadata.full_name || email.split('@')[0];
                const avatar = metadata.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0D8ABC&color=fff&size=128`;
                
                document.getElementById('profile-name').textContent = name;
                document.getElementById('profile-email').textContent = email;
                document.getElementById('profile-avatar').src = avatar;

                // Formatar Data
                if (user.created_at) {
                    const date = new Date(user.created_at);
                    document.getElementById('profile-date').textContent = date.toLocaleDateString('pt-BR');
                }
            }
        });

        async function deleteAccount() {
            const confirmed = confirm("Tem certeza absoluta? Todos os seus roteiros salvos serão apagados e essa ação não pode ser desfeita.");
            if (!confirmed) return;

            const btn = document.getElementById('delete-btn');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">Excluindo...</span>`;

            try {
                const res = await window.auth.fetchWithAuth('/api/users/me', {
                    method: 'DELETE'
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || "Erro ao excluir conta");
                }

                alert("Conta excluída com sucesso!");
                await window.auth.signOut();
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerHTML = "Excluir Minha Conta";
            }
        }
    </script>
</body>
</html>
